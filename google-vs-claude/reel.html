<!doctype html>
<html><head><meta charset="utf-8"><title>Google vs Claude reel</title>
<style>
/* Friday reel "This is Google. This is Claude." 1080x1920. Every frame = seek(t), a pure function of time (timing.js = the voice's word onsets). */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --sf: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F4F4F1; font-family: var(--sf); }
#frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden;
  background: radial-gradient(120% 75% at 50% 30%, #FFFFFF 0%, #E9E9E4 100%); }
.floor { position: absolute; left: 0; top: 0; }
.cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.cam > *, .grp > *, .clip > *, .abs { position: absolute; }
.grp { left: 0; top: 0; width: 0; height: 0; }
.tile { display: grid; place-items: center; background: #fff; box-shadow: 0 12px 0 #DADAD4, 0 34px 50px -18px rgba(0,0,0,.3); transform-origin: 50% 100%; }
.sbox { height: 110px; border-radius: 55px; background: #fff; display: flex; align-items: center; gap: 16px; padding: 0 34px; font: 500 34px var(--sf); color: #8A8A85;
  transform: perspective(900px) rotateX(48deg); box-shadow: 0 14px 0 #DADAD4, 0 40px 60px -20px rgba(0,0,0,.28); }
.caret { display: block; width: 3px; height: 40px; background: #4A4A46; border-radius: 2px; margin-right: -6px; }
.ring { height: 110px; border-radius: 55px; border: 6px solid #C9923E; box-shadow: 0 0 44px rgba(201,146,62,.75), inset 0 0 20px rgba(201,146,62,.35); transform: perspective(900px) rotateX(48deg); opacity: 0; }
.flash { height: 150px; border-radius: 75px; border: 7px solid #C9923E; box-shadow: 0 0 70px rgba(201,146,62,.65), inset 0 0 30px rgba(201,146,62,.3); transform: perspective(900px) rotateX(48deg); opacity: 0; }
.shadow, .cshadow, .lshadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.25), rgba(0,0,0,0)); filter: blur(5px); }
.card { background: #fff; border-radius: 16px; box-shadow: 0 10px 0 #DADAD4, 0 30px 44px -16px rgba(0,0,0,.24); overflow: hidden; }
.clip { overflow: hidden; }
.lbl { text-align: center; font: 800 44px/1.12 var(--sf); color: #1a1a1a; letter-spacing: -.02em; transform-origin: 50% 0; }
.row { height: 52px; } .row b { display: block; height: 13px; border-radius: 7px; background: #4285F4; transform-origin: 0 50%; } .row i { display: block; margin-top: 9px; height: 7px; border-radius: 4px; background: #1FB441; opacity: .7; transform-origin: 0 50%; }
svg .ln, svg.ln path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; }
.num { font: 900 300px/1 var(--sf); color: #C9923E; letter-spacing: 0; transform-origin: 50% 80%;
  text-shadow: 1px 1px 0 #B07F33, 2px 2px 0 #AB7A30, 3px 3px 0 #A6762D, 4px 4px 0 #A1722B, 5px 5px 0 #9C6E28, 6px 6px 0 #976A26, 7px 7px 0 #926623, 8px 8px 0 #8D6221, 9px 9px 0 #885E1F, 10px 10px 0 #835A1D, 14px 18px 30px rgba(0,0,0,.22); }
.tile2.ghost { background: transparent; box-shadow: none; outline: 4px dashed #CFCAC0; outline-offset: -4px; } .tile2.ghost > * { visibility: hidden; }
.tile2 { width: 200px; padding: 18px 0 16px; border-radius: 30px; background: #fff; display: grid; justify-items: center; gap: 4px; font: 700 29px/1.1 var(--sf); color: #3a3a37; text-align: center;
  box-shadow: 0 10px 0 #DADAD4, 0 30px 40px -18px rgba(0,0,0,.25); transform-origin: 50% 100%; }
.divider { width: 5px; background: repeating-linear-gradient(#C3C3BB 0 16px, transparent 16px 30px); transform-origin: 50% 0; }
.check { width: 62px; height: 62px; border-radius: 50%; background: #C9923E; display: grid; place-items: center; box-shadow: 0 5px 0 #9C6E28; }
.bubble { max-width: 700px; padding: 26px 34px 28px; border-radius: 34px 34px 8px 34px; background: #EFEBE2; font: 600 50px/1.22 var(--sf); color: #1a1a1a; letter-spacing: -.015em;
  box-shadow: 0 8px 0 #DCD6CA, 0 26px 40px -18px rgba(0,0,0,.2); transform-origin: 100% 100%; }
.bubble .cr { display: inline-block; width: 4px; height: 46px; margin-left: 3px; vertical-align: -8px; background: #D97757; border-radius: 2px; }
.reply { padding: 30px 40px 26px; border-radius: 30px; }
.reply .rr { display: flex; align-items: center; gap: 20px; height: 70px; font: 700 44px var(--sf); color: #55524c; letter-spacing: -.02em; }
.reply .rh { display: flex; align-items: center; gap: 14px; height: 54px; font: 700 32px var(--sf); color: #1a1a1a; }
.reply .rh i { display: flex; gap: 7px; margin-left: 6px; } .reply .rh i b { width: 11px; height: 11px; border-radius: 50%; background: #D97757; }
.reply .res { margin-top: 14px; padding: 22px 26px; border-radius: 22px; background: #F9E1D3; font: 800 56px/1.06 var(--sf); transform-origin: 30% 50%; color: #1a1a1a; letter-spacing: -.025em; }
.vig { left: -1000px; top: -1000px; width: 3080px; height: 3920px; background: radial-gradient(closest-side at 50% 50%, rgba(0,0,0,0) 22%, rgba(20,16,10,.15) 62%); pointer-events: none; }
.xbadge { width: 76px; height: 76px; border-radius: 50%; background: #FF3B30; display: grid; place-items: center; box-shadow: 0 6px 0 #C2261D, 0 14px 24px -8px rgba(0,0,0,.35); }
.menu { padding: 38px 40px; border-radius: 26px; overflow: visible; }
.menu .mt { font: 800 44px Georgia, "Times New Roman", serif; letter-spacing: .08em; color: #1a1a1a; text-align: center; padding-bottom: 18px; border-bottom: 3px solid #1a1a1a; margin-bottom: 18px; }
.menu .dish { height: 84px; display: flex; align-items: center; padding-left: 18px; font: 600 36px var(--sf); color: #1a1a1a; border-bottom: 2px dashed #D3D3CC; }
.term { border-radius: 30px; background: #0E0E0E; color: #EDEAE3; padding: 0 0 26px; overflow: hidden; box-shadow: 0 12px 0 #2a2a2a, 0 50px 70px -30px rgba(0,0,0,.45); }
.term .tbar { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #1B1B1B; }
.term .tbar i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.term .tbar span { flex: 1; text-align: center; margin-right: 70px; font: 600 24px var(--sf); color: #8F8B84; }
.term .thead { display: flex; align-items: center; gap: 26px; padding: 26px 36px 12px; }
.term .thead b { display: block; font: 800 46px var(--sf); color: #fff; letter-spacing: -.02em; }
.term .thead small { display: block; font: 500 26px ui-monospace, "SF Mono", Menlo, monospace; color: #8F8B84; margin-top: 4px; }
.term .tline { padding: 14px 36px 10px; font: 600 37px ui-monospace, "SF Mono", Menlo, monospace; color: #E0B163; white-space: nowrap; }
.term .tline .pr { color: #D97757; }
.term .tcr { display: inline-block; width: 17px; height: 36px; background: #E0B163; vertical-align: -6px; margin-left: 4px; }
.term .tcheck { padding: 4px 36px; font: 600 35px ui-monospace, "SF Mono", Menlo, monospace; color: #EDEAE3; }
.term .tcheck .ok { color: #3FD07A; }
.cpill { display: flex; align-items: center; gap: 20px; padding: 0 34px 0 22px; border-radius: 56px; background: #fff; box-shadow: 0 10px 0 #DADAD4, 0 30px 40px -18px rgba(0,0,0,.25); }
.cpill .cav { width: 72px; height: 72px; border-radius: 50%; background: #E4E2DC; display: grid; place-items: center; flex: none; }
.cpill .cin { flex: 1; font: 500 38px var(--sf); color: #9A968E; white-space: nowrap; }
.cpill .cin b { font: 900 48px var(--sf); color: #C9923E; letter-spacing: .05em; }
.cpill .ccr { display: inline-block; width: 4px; height: 46px; background: #1a1a1a; vertical-align: -8px; margin-left: 4px; }
.cpill .cpost { font: 700 38px var(--sf); color: #B8D9F5; }
.pdf { border-radius: 24px; background: #0A0A0A; color: #F0EDE6; padding: 36px 32px; display: flex; flex-direction: column; justify-content: space-between; transform-origin: 50% 60%;
  box-shadow: 0 0 0 5px #C9923E, 0 16px 0 #2a2a2a, 0 50px 90px -20px rgba(201,146,62,.6); }
.pdf small { font: 700 21px var(--sf); letter-spacing: .2em; color: #E0B163; }
.pdf p { font: 900 54px/1.02 var(--sf); letter-spacing: -.03em; } .pdf p span { color: #E0B163; }
.pdf i { font: 800 32px/1.2 var(--sf); color: #E0B163; font-style: normal; letter-spacing: .05em; }
.pdf { overflow: hidden; } .pdf .shine { position: absolute; top: -40%; left: 0; width: 34%; height: 180%; background: linear-gradient(90deg, rgba(255,226,160,0), rgba(255,226,160,.38), rgba(255,226,160,0)); transform: translateX(-200%) rotate(18deg); pointer-events: none; }
.strike { position: absolute; height: 10px; border-radius: 5px; background: #FF3B30; transform-origin: 0 50%; }
.disc { left: 0; width: 1080px; text-align: center; } .disc span { display: inline-block; padding: 10px 26px; border-radius: 999px; background: #fff; font: 600 32px var(--sf); color: #4E4B45; box-shadow: 0 6px 0 #DADAD4; }
#supers, #over { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
.super { position: absolute; left: 40px; width: 1000px; top: 236px; text-align: center; font: 800 96px/1.04 var(--sf); letter-spacing: -.045em; color: #0A0A0A; visibility: hidden; }
.super .ln { white-space: nowrap; }
.super .w { display: inline-block; margin: 0 .13em; transform-origin: 50% 85%; }
.super .o { color: #D97757; } .super .g { color: #C9923E; }
.super svg.wm { display: inline-block; vertical-align: -0.17em; margin-left: .16em; }
.super .ph { display: inline-block; width: 102px; height: 10px; }
.super.big { top: 250px; font-size: 128px; }
.super.light { color: #F0EDE6; }
/* Ciko's own world for the ending: warm black, a slow gold light, gold grid (option B, 24 Oct) */
.scene.dark { background: radial-gradient(120% 75% at 50% 22%, #1E1812 0%, #0D0B09 58%, #060504 100%); }
.scene.dark .floor path { stroke: rgba(201,146,62,.34); }
.leak { left: -300px; top: -300px; width: 1680px; height: 1100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(224,177,99,.30), rgba(201,146,62,.10) 55%, rgba(201,146,62,0) 100%); filter: blur(30px); pointer-events: none; }
.vig2 { left: -200px; top: -200px; width: 1480px; height: 2320px; background: radial-gradient(closest-side at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
.scene.dark .term { box-shadow: 0 0 0 2px rgba(201,146,62,.5), 0 0 60px rgba(201,146,62,.18), 0 40px 90px -20px rgba(0,0,0,.85); }
.scene.dark .cpill { background: #F6F3EE; box-shadow: 0 10px 0 #2A241C, 0 30px 50px -18px rgba(0,0,0,.6); }
.scene.dark .disc span { background: #1C1915; color: #C9C2B6; box-shadow: 0 0 0 1px rgba(201,146,62,.35); }
.super.huge { top: 330px; font: 900 250px/1 var(--sf); color: #C9923E; letter-spacing: -.04em;
  text-shadow: 1px 1px 0 #B07F33, 2px 2px 0 #AB7A30, 3px 3px 0 #A6762D, 4px 4px 0 #A1722B, 5px 5px 0 #9C6E28, 6px 6px 0 #976A26, 7px 7px 0 #926623, 8px 8px 0 #8D6221, 9px 9px 0 #885E1F, 10px 10px 0 #835A1D, 14px 18px 30px rgba(0,0,0,.22); }
.uline { position: absolute; height: 12px; border-radius: 6px; background: #C9923E; transform-origin: 0 50%; }
#badge { position: absolute; left: 0; top: 0; width: 92px; height: 92px; border-radius: 50%; background: #C9923E; color: #fff; display: grid; place-items: center; font: 800 62px/1 var(--sf); box-shadow: 0 6px 0 #9C6E28; visibility: hidden; }
#fly, #bigN { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; }
#bigN { font-size: 560px; }
.super.mid { font-size: 80px; }
#safe { position: absolute; inset: 0; display: none; }
</style></head>
<body>
<div id="frame"><div id="scenes"></div><div id="supers"></div><div id="over"></div>
<svg id="safe" width="1080" height="1920"><path d="M0 200H1080M0 1480H1080M120 0V1920M960 0V1920" stroke="red" stroke-width="3" fill="none"/></svg>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg></div>
<script src="words.js"></script><script src="timing.js"></script><script src="assets.js"></script>
<script>
(() => {
const { T, DUR, W } = TIMING, A = ASSETS;
const OR = '#D97757', GOLD = '#C9923E', GREEN = '#1FB441', BLUE = '#4285F4', INK = '#1a1a1a';
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const eo = (x) => 1 - (1 - x) ** 3, eo5 = (x) => 1 - (1 - x) ** 5, ei = (x) => x ** 3, eio = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const mix = (a, b, x) => a + (b - a) * x;
const spring = (tt, k = 16, f = 24) => (tt <= 0 ? 0 : 1 - Math.exp(-tt * k) * Math.cos(tt * f));
const wobble = (tt, a = 1, k = 9, f = 24) => (tt <= 0 ? 0 : a * Math.exp(-tt * k) * Math.sin(tt * f));
const pulse = (t, t0, d = 0.3) => (t < t0 ? 0 : t - t0 < 0.06 ? (t - t0) / 0.06 : Math.exp(-(t - t0 - 0.06) / d));
const popO = (t, t0) => clamp((t - t0) / 0.06);

// ---------- tiny style setters ----------
function put(el, o = {}) {
  const { x = 0, y = 0, s = 1, sx = 1, sy = 1, r = 0, pre = '', post = '' } = o, op = o.o ?? 1;
  if (op <= 0.002) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = '';
  el.style.opacity = op >= 0.998 ? '' : op.toFixed(3);
  el.style.transform = `${pre}translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg) scale(${(s * sx).toFixed(4)},${(s * sy).toFixed(4)})${post}`;
  if ('blur' in o) el.style.filter = o.blur > 0.25 ? `blur(${o.blur.toFixed(2)}px)` : '';
}
const popIn = (el, t, t0, extra = {}) => put(el, { s: spring(t - t0), o: popO(t, t0), ...extra });
function draw(el, p) { el.style.strokeDashoffset = (1 - p).toFixed(4); el.style.opacity = p > 0.001 ? '' : '0'; }
function drop(t, tl, h = 600, d = 0.2) {
  if (t < tl - d) return { y: -h, sx: 1, sy: 1, o: 0, h: 1 };
  if (t < tl) { const x = (t - tl + d) / d; return { y: -h * (1 - x * x), sx: 0.95, sy: 1.06, o: 1, h: 1 - x * x }; }
  const tt = t - tl, q = Math.exp(-tt * 13) * Math.cos(tt * 30);
  return { y: 0, sx: 1 + 0.13 * q, sy: 1 - 0.17 * q, o: 1, h: 0 };
}
const shadowFor = (el, h, o = 1) => put(el, { s: 1 - 0.55 * h, o: o * (1 - 0.8 * h) });

// ---------- logos + drawings ----------
const gSvg = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${A.G}</svg>`;
const cSvg = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="${A.CL}" fill="${OR}"/></svg>`;
const wm = (h) => `<svg class="wm" height="${h}" width="${Math.round((h * 272) / 92)}" viewBox="0 0 272 92">${A.WM}</svg>`;
const MASCOT = [' ▐▛███▛█', '▝▜██████▀', '  ▝▝ ▝▝'], Q = { '█': '1111', '▐': '0101', '▛': '1110', '▜': '1101', '▝': '0100', '▀': '1100', ' ': '0000' };
function mascot(cell) {
  let r = '';
  MASCOT.forEach((row, y) => [...row].forEach((ch, x) => [...Q[ch]].forEach((on, q) => {
    if (on === '1') r += `<rect x="${x * cell + (q % 2) * cell / 2}" y="${y * 2 * cell + (q >> 1) * cell}" width="${cell / 2 + 0.6}" height="${cell + 0.6}"/>`;
  })));
  return `<svg width="${9 * cell}" height="${6 * cell}" viewBox="0 0 ${9 * cell} ${6 * cell}"><g fill="${OR}">${r}</g></svg>`;
}
const SEARCH = `<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#8A8A85" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>`;
const ICON = {
  news: 'M6 9h30v30H6z M36 15h6v20a4 4 0 0 1-4 4 M11 16h20 M11 22h20 M11 28h12',
  clock: 'M24 8a16 16 0 1 1 0 32a16 16 0 1 1 0-32 M24 14v10l7 5',
  tag: 'M8 24 24 8h14v14L22 38z M31 12a3 3 0 1 1 0 6a3 3 0 1 1 0-6',
  pen: 'M10 38l4-12 18-18 8 8-18 18z M28 12l8 8',
  cal: 'M11 11h26a3 3 0 0 1 3 3v23a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z M8 19h32 M16 7v8 M32 7v8',
  bulb: 'M18 33h12 M19 38h10 M24 7a11 11 0 0 0-7 19.5V30h14v-3.5A11 11 0 0 0 24 7z',
};
const icon = (k, color, id = '', drawn = false) => `<svg viewBox="0 0 48 48" width="106" height="106"><path ${id ? `id="${id}"` : ''} ${drawn ? 'class="ln" pathLength="1"' : ''} d="${ICON[k]}" fill="none" stroke="${color}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let pid = 0;
const person = (c = '#9FB3C8', d = '#6F86A0') => { const id = 'pg' + pid++; return `<svg width="120" height="230" viewBox="0 0 120 230"><defs><radialGradient id="${id}h" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></radialGradient><linearGradient id="${id}b" x1="0" x2="1"><stop offset="0" stop-color="${d}"/><stop offset=".35" stop-color="${c}"/><stop offset=".7" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs><circle cx="60" cy="38" r="30" fill="url(#${id}h)"/><path d="M18 230 V120 Q18 78 60 78 Q102 78 102 120 V230 Z" fill="url(#${id}b)"/></svg>`; };
const listSvg = (w = 170) => `<svg width="${w}" height="130" viewBox="0 0 ${w} 130"><rect width="${w}" height="130" rx="14" fill="#fff"/>${[0, 1, 2, 3, 4].map((i) => `<path d="M16 ${22 + i * 21}h${w - 46 - (i % 2) * 30}" stroke="${BLUE}" stroke-width="6" stroke-linecap="round"/>`).join('')}</svg>`;
const CHECK = (id, color = GREEN, w = 12) => `<path id="${id}" class="ln" pathLength="1" stroke="${color}" stroke-width="${w}" d="M8 30 L24 46 L56 10"/>`;

// ---------- scene shells ----------
const defs = $('defs');
function floorSvg(id, hz) {
  defs.insertAdjacentHTML('beforeend', `<filter id="mb-${id}" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbk-${id}" stdDeviation="0 0"/></filter>`);
  return `<svg class="floor" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="fg-${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${hz}" x2="0" y2="${hz + 430}"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="fm-${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><rect width="1080" height="1920" fill="url(#fg-${id})"/></mask></defs>
    <path id="grid-${id}" mask="url(#fm-${id})" stroke="#ADADA6" stroke-width="2.4" stroke-dasharray="11 11" fill="none"/></svg>`;
}
const HZ = { intro: 990, nums: 930, d1: 990, d2: 1010, d3: 990, sum: 1000, rest: 1000, cta: 990 };
const scene = (id, inner) => `<div class="scene${id === 'cta' ? ' dark' : ''}" id="${id}">${floorSvg(id, HZ[id])}<div class="cam" id="${id}-cam">${inner}</div></div>`;
function floorPath(vx, hz, ph) {
  const B = 2000; let d = '';
  for (let i = -20; i <= 20; i++) d += `M${(540 + i * 170 - vx).toFixed(1)} ${B}L${(540 + i * 10 - vx * 0.06).toFixed(1)} ${hz}`;
  const f = ((ph % 1) + 1) % 1;
  for (let k = 0; k <= 13; k++) { const u = (k + f) / 13; if (u <= 1) d += `M-300 ${(hz + (B - hz) * u ** 1.9).toFixed(1)}H1380`; }
  return d;
}
function camStep(id, fn, t) {
  const c = fn(t), c2 = fn(t + 1 / 30);
  $(id + '-cam').style.transform = `translate(540px,1080px) scale(${c.s.toFixed(4)}) translate(${(-c.cx).toFixed(2)}px,${(-c.cy).toFixed(2)}px)`;
  $('grid-' + id).setAttribute('d', floorPath((c.cx - 540) * c.s, HZ[id], t * 0.12 + Math.log(c.s) * 2.5));
  return { bx: Math.max(0, Math.abs(c2.cx - c.cx) * c.s * 0.4 - 6), by: Math.max(0, Math.abs(c2.cy - c.cy) * c.s * 0.4 - 6) }; // blur whips, keep slow pushes sharp
}
function sceneFx(id, o, bx = 0, by = 0) { // whole-scene move (cuts) + directional motion blur
  const el = $(id);
  el.style.transform = o ? `translate(${(o.x || 0).toFixed(1)}px,${(o.y || 0).toFixed(1)}px) scale(${(o.s ?? 1).toFixed(4)})` : '';
  el.style.opacity = o && o.o !== undefined && o.o < 0.998 ? o.o.toFixed(3) : '';
  if (Math.hypot(bx, by) < 0.6) { el.style.filter = ''; return; }
  $('mbk-' + id).setAttribute('stdDeviation', `${Math.min(42, bx).toFixed(1)} ${Math.min(42, by).toFixed(1)}`);
